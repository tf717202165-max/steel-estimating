<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-driven model build</title>
<meta name="description" content="Watch a real tender model being built stage by stage: grids, columns, rafters, bracing, purlins, bridging, connections.">
<style>
:root{--navy:#16324f;--ink:#1c2733;--mute:#5b6b7a;--line:#d9dfe5;--amber:#e8891c}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:#eef1f4;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.top .brand{font-weight:700;color:var(--navy);text-decoration:none}.top .brand span{color:var(--amber)}
.badge{background:var(--navy);color:#fff;font-size:11px;font-weight:700;letter-spacing:.6px;padding:3px 9px;border-radius:10px}
.cases{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}.cases a{font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--mute);background:#fff}
.cases a.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
.main{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}
#stage{position:relative;min-height:320px;overflow:hidden}#stage canvas{display:block;width:100%;height:100%}
.side{background:#fff;border-left:1px solid var(--line);padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
#stages{list-style:none;margin:0;padding:0}#stages li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13.5px;cursor:pointer;color:#8a98a6}
#stages li b{font-weight:600;flex:1}#stages li em{font-style:normal;font-size:12px}#stages li.done{color:var(--ink)}#stages li.on{background:#eef4fb;color:var(--navy)}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.cap{position:absolute;left:14px;bottom:14px;max-width:min(560px,calc(100% - 28px));background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 6px 24px rgba(22,50,79,.12)}
.cap small{color:var(--mute);font-size:11.5px;letter-spacing:.5px;text-transform:uppercase}.cap h3{margin:2px 0 8px;font-size:18px;color:var(--navy)}
.cap p{margin:4px 0 0;font-size:13.5px;line-height:1.45}.cap p b{display:inline-block;min-width:68px;font-size:11px;letter-spacing:.5px;color:#fff;background:var(--navy);border-radius:4px;padding:1px 6px;margin-right:6px;text-align:center}
.cap p.me b{background:var(--amber)}
.ctl{display:flex;gap:8px;align-items:center}.ctl button,.ctl a{font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;text-decoration:none}
.ctl button#play{background:var(--navy);color:#fff}
.track{height:5px;background:#e3e8ed;border-radius:3px;overflow:hidden}#prog{height:100%;width:0;background:var(--amber)}
#count{font-size:12.5px;color:var(--mute)}#stats{font-size:12px;color:var(--mute)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#eef1f4;z-index:3;flex-direction:column;gap:10px;font-size:14px;color:var(--mute)}
#overlay.hide{display:none}.lb{width:240px;height:6px;background:#dde3e9;border-radius:3px;overflow:hidden}#loadBar{height:100%;width:0;background:var(--navy)}
.hint{position:absolute;right:12px;top:10px;font-size:11.5px;color:var(--mute)}
body.embed .top{display:none}
@media(max-width:760px){.main{grid-template-columns:1fr;grid-template-rows:minmax(360px,1fr) auto}.side{border-left:0;border-top:1px solid var(--line)}.cap{position:static;max-width:none;margin:0;border-radius:0;border-width:1px 0 0}#stage{display:flex;flex-direction:column}#stage canvas{flex:1;min-height:300px}}
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="../index.html">Rapid<span>Steel</span> MTO</a><span class="badge">AI-DRIVEN MODELLING</span>
  <div class="cases"><a data-case="warehouse">Warehouse &amp; office</a><a data-case="haigslea">School hall</a><a data-case="anzac-avenue">Retail</a><a data-case="plant">Industrial plant</a></div>
</div>
<div class="main">
  <div id="stage">
    <div id="overlay"><div id="loadText">Loading…</div><div class="lb"><div id="loadBar"></div></div></div>
    <div class="hint">Drag to rotate · scroll to zoom</div>
    <div class="cap"><small id="capStep">Step 1</small><h3 id="capName">Grids &amp; levels</h3>
      <p><b>AI</b><span id="capAi"></span></p><p class="me"><b>ESTIMATOR</b><span id="capMe"></span></p></div>
  </div>
  <div class="side">
    <div class="ctl"><button id="play">Pause</button><button id="replay">Replay</button><a id="open" target="_top">Inspect members</a></div>
    <div class="track"><div id="prog"></div></div><div id="count"></div>
    <ul id="stages"></ul>
    <div id="stats"></div>
  </div>
</div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/",
  "web-ifc":"https://cdn.jsdelivr.net/npm/web-ifc@0.0.74/web-ifc-api.js"
}}
</script>
<script type="module" src="build.js?v=202611161947"></script>
</body>
</html>
